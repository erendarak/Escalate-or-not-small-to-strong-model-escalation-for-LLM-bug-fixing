name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Evaluator tests
        run: python -m pytest -q
      - name: Fake campaign (no model needed)
        run: |
          sed 's/^campaign: dev_fake$/campaign: ci_fake/' configs/dev_fake.yaml > ci_fake.yaml
          python -m routing_pilot.cli run --config ci_fake.yaml
          grep -q "| small_only | 0.0% |" results/ci_fake/summary.md
          grep -q "| strong_only | 100.0% |" results/ci_fake/summary.md
          grep -q "| escalate | 100.0% |" results/ci_fake/summary.md
      - name: Committed eval summaries rebuild identically from the logs
        run: |
          python -m routing_pilot.cli analyse --campaign eval_local_v1 > /dev/null
          python -m routing_pilot.cli analyse --campaign escalate_clean_v1 > /dev/null
          git diff --exit-code results/eval_local_v1 results/escalate_clean_v1

  docker:
    # Added November 2026: the evaluator image builds, and tests + fake campaign pass inside it (no GPU needed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build evaluator image
        run: docker build -f docker/Dockerfile -t routing-pilot:ci .
      - name: Tests inside the container
        run: docker run --rm routing-pilot:ci
      - name: Fake campaign inside the container
        run: |
          docker run --rm routing-pilot:ci sh -c '
            python -m routing_pilot.cli run --config configs/dev_fake.yaml --campaign ci_fake > /dev/null &&
            grep -q "| small_only | 0.0% |" results/ci_fake/summary.md &&
            grep -q "| strong_only | 100.0% |" results/ci_fake/summary.md &&
            grep -q "| escalate | 100.0% |" results/ci_fake/summary.md'
      - name: Compose file is valid
        run: docker compose config --quiet
