name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Evaluator tests
        run: python -m pytest -q
      - name: Fake campaign (no model needed)
        run: |
          sed 's/^campaign: dev_fake$/campaign: ci_fake/' configs/dev_fake.yaml > ci_fake.yaml
          python -m routing_pilot.cli run --config ci_fake.yaml
          grep -q "| small_only | 0.0% |" results/ci_fake/summary.md
          grep -q "| strong_only | 100.0% |" results/ci_fake/summary.md
          grep -q "| escalate | 100.0% |" results/ci_fake/summary.md
      - name: Committed eval summaries rebuild identically from the logs
        run: |
          python -m routing_pilot.cli analyse --campaign eval_local_v1 > /dev/null
          python -m routing_pilot.cli analyse --campaign escalate_clean_v1 > /dev/null
          git diff --exit-code results/eval_local_v1 results/escalate_clean_v1
