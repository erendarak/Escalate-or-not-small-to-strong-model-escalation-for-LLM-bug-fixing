# EXPLORATORY, post-hoc (designed AFTER seeing eval_local_v1; see docs/exploratory.md).
# escalate_clean = [small, strong], but the strong call gets the original prompt + visible-test
# feedback only, NOT the small model's code. Everything else identical to configs/eval_local.yaml
# (same eval tasks, repeats, seeds, models, prices). Never reported as pre-registered.
#   26 eval tasks x 1 policy x 3 repeats = 78 runs
campaign: escalate_clean_v1
split: eval
repeats: 3
seed: 2026             # base seed; repeat r uses seed + r (2026, 2027, 2028), same for every policy in a repeat
test_timeout_s: 3
budget_usd: 0          # budget guard counts only billed (hosting: api) calls; none here
models:
  small:
    kind: openai_compat
    model: qwen2.5-coder:1.5b   # Ollama digest d7372fd82851 (Q4_K_M)
    # Standardized list-price ESTIMATE (not billed: runs locally). Fireworks AI serverless size tier
    # 'less than 4B parameters': $0.10/1M tokens, same for input and output. Source: https://docs.fireworks.ai/serverless/pricing
    # (retrieved 2026-10-07; page lists size tiers, not this model by name).
    usd_per_1m_input: 0.1
    usd_per_1m_output: 0.1
    base_url: http://localhost:11434/v1
    temperature: 0.2
  strong:
    kind: openai_compat
    model: qwen2.5-coder:7b     # Ollama digest dae161e27b0e (Q4_K_M)
    # Standardized list-price ESTIMATE (not billed: runs locally). Fireworks AI serverless size tier
    # '4B - 16B parameters': $0.20/1M tokens, same for input and output. Source: https://docs.fireworks.ai/serverless/pricing
    # (retrieved 2026-10-07; page lists size tiers, not this model by name).
    usd_per_1m_input: 0.2
    usd_per_1m_output: 0.2
    base_url: http://localhost:11434/v1
    temperature: 0.2
policies:
  escalate_clean: [small, strong]
feedback_only_policies: [escalate_clean]
