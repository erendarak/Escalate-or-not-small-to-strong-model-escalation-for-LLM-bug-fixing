# Two services: Ollama serving the models on the GPU, and the evaluator calling it over HTTP.
#
#   docker compose up -d ollama                 # start the model server
#   ./docker/pull_models.sh                     # or docker\pull_models.ps1 on Windows
#   docker compose run --rm evaluator python -m routing_pilot.cli check --config configs/dev_local.yaml
#
# Needs Docker with the NVIDIA GPU runtime (Docker Desktop + WSL 2 on Windows).
services:
  ollama:
    image: ollama/ollama:0.40.0          # pinned; same version as the native Windows install used for comparison
    ports:
      - "127.0.0.1:11435:11434"          # host port 11435, so it can run next to a native Ollama on 11434
    volumes:
      - ollama-models:/root/.ollama      # models persist across container restarts
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_PARALLEL=4            # allow up to 4 concurrent requests per model (serving benchmark)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  evaluator:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: routing-pilot:dev
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434  # rewrites the configs' localhost:11434 URLs (see models.ollama_base_url)
    volumes:
      - ./results:/app/results           # campaign outputs land on the host
    profiles: ["eval"]                   # not started by a plain `docker compose up`; use `docker compose run`

  # Optional (added November 2026): the 1.5B model served by vLLM behind an OpenAI-compatible API, for the
  # serving benchmark. Unquantized BF16 weights from Hugging Face (about 3 GB), so not the same precision as
  # Ollama's Q4_K_M. Stop the Ollama models first on an 8 GB GPU: vLLM reserves a fixed share of VRAM.
  #   docker compose --profile vllm up -d vllm
  vllm:
    image: vllm/vllm-openai:v0.33.0
    command:
      - --model=Qwen/Qwen2.5-Coder-1.5B-Instruct
      - --served-model-name=qwen2.5-coder:1.5b   # same name as in Ollama, so the benchmark sends identical requests
      - --max-model-len=4096                     # same context as the Ollama runs
      - --gpu-memory-utilization=0.75            # share of total VRAM vLLM pre-allocates (weights + KV cache)
      - --seed=0
      - --generation-config=vllm                 # ignore the model's sampling defaults (e.g. repetition_penalty 1.1)
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface        # downloaded weights persist
    shm_size: 2gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    profiles: ["vllm"]

volumes:
  ollama-models:
  hf-cache:
