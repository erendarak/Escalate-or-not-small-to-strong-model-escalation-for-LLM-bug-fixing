[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "routing-pilot"
version = "1.0.0"
description = "Small-to-strong model escalation for LLM bug fixing: a pre-registered study on QuixBugs"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Eren Darak"}]
requires-python = ">=3.10"
dependencies = ["openai>=1.40", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
