[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "routing-pilot"
version = "0.1.0"
description = "Independent pilot: cost-quality trade-offs of model routing for LLM bug-fixing agents"
requires-python = ">=3.10"
dependencies = ["openai>=1.40", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
